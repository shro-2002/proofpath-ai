<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProofPath AI</title>
  <meta name="description" content="Evidence-driven career transition agent. Stop collecting courses. Start proving you're ready for the job.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">ProofPath</div>
          <div class="brand-tag">Evidence ledger</div>
        </div>
      </div>
      <nav id="nav" aria-label="Main navigation">
        <a href="#/overview" data-view="overview">Overview</a>
        <a href="#/ledger" data-view="ledger">Evidence ledger</a>
        <a href="#/plan" data-view="plan">Plan <span class="nav-dot" id="nav-proposal" hidden aria-label="Proposal waiting"></span></a>
        <a href="#/assess" data-view="assess">Assessments</a>
        <a href="#/projects" data-view="projects">Projects</a>
        <a href="#/applications" data-view="applications">Applications</a>
        <a href="#/activity" data-view="activity">Agent activity</a>
      </nav>
      <div class="sidebar-foot">
        <div id="engine-pill" class="pill">Checking engine…</div>
        <button class="link-btn" id="reset-btn" type="button">New intake</button>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <div id="banner" role="alert" hidden></div>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <div id="drawer-backdrop" hidden></div>
  <aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div id="drawer-body"></div>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/static/ui.js"></script>
  <script src="/static/views.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
